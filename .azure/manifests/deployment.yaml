apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookrating-api
  namespace: bookrating
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookrating-api
  template:
    metadata:
      labels:
        app: bookrating-api
    spec:
      containers:
      - name: bookrating-api
        image: bookratingacr.azurecr.io/bookrating-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__DefaultConnection
          value: "Server=mssql,1433;Database=BookRatingDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
        - name: Elasticsearch__Uri
          value: "http://elasticsearch:9200"
        - name: Elasticsearch__DefaultIndex
          value: "books"
        - name: Elasticsearch__Username
          value: ""
        - name: Elasticsearch__Password
          value: ""
        - name: Jwt__Key
          value: "your-super-secret-jwt-key-min-32-characters-long-12345"
        - name: Jwt__Issuer
          value: "BookRatingAPI"
        - name: Jwt__Audience
          value: "BookRatingAPIUsers"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
