apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookrating-api
  namespace: bookrating
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookrating-api
  template:
    metadata:
      labels:
        app: bookrating-api
    spec:
      containers:
      - name: bookrating-api
        image: bookratingacr.azurecr.io/bookrating-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
