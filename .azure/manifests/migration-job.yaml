apiVersion: batch/v1
kind: Job
metadata:
  name: bookrating-migration
  namespace: bookrating
spec:
  template:
    spec:
      containers:
      - name: migration
        image: bookratingacr.azurecr.io/bookrating-api:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            dotnet ef database update --project /app/BookRatingAPI.dll || echo "Migration completed or failed"
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Server=mssql,1433;Database=BookRatingDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      restartPolicy: Never
  backoffLimit: 3
